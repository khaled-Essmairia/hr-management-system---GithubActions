name: Build & Deploy Spring app

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    name: Build and Deploy Spring boot for beginner
    runs-on: ubuntu-latest
    services:


     sqlserver:
       image: mcr.microsoft.com/mssql/server:2022-latest
       env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "MyStrongPassword123"
       ports:
       - 1433:1433
       options: >-
                      --health-cmd "/opt/mssql-tools18/bin/sqlcmd
                      -S localhost,1433
                      -U sa
                      -P 'MyStrongPassword123'
                      -C
                      -Q 'SELECT 1'"
                      --health-interval 10s
                      --health-timeout 5s
                      --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: 17

      - name: Unit Tests
        run: mvn -B test --file pom.xml

      - name: Build the application
        run: |
          mvn clean
          mvn clean package -DskipTests
          
      - name: Build Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: "${{ secrets.DOCKER_HUB_USERNAME }}/spring-boot-for-beginners:today"
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v2
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: "${{ secrets.DOCKER_HUB_USERNAME }}/spring-boot-for-test:today"	  